name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify versions
        run: |
          node -v
          npm -v

      - name: Sanity check lockfile versions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          let bad = 0;
          const pkgs = lock.packages || {};
          for (const [path, meta] of Object.entries(pkgs)) {
            if (path === "") continue;
            const v = meta && meta.version;
            if (v === "" || v == null) {
              console.log("❌ EMPTY VERSION in lockfile package:", path, meta && meta.name);
              bad++;
            }
            if (typeof v === "string" && v.trim() !== v) {
              console.log("❌ VERSION HAS WHITESPACE:", path, JSON.stringify(v));
              bad++;
            }
          }
          if (bad) process.exit(1);
          console.log("✅ Lockfile versions look non-empty.");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Print npm debug log on failure
        if: failure()
        run: |
          echo "=== npm logs ==="
          ls -la /home/runner/.npm/_logs || true
          echo "=== tail debug log ==="
          tail -n 200 /home/runner/.npm/_logs/*debug-0.log || true

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
